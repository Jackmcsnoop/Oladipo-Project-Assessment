<body>
    <header>
        <div class="logoContainer">
            <img src="Images/Logo.png"><!--- The logo of the company that goes in the top left corner of the website --->
            <h1>TechZone</h1> <!--- The name of the company held in the header --->
        </div>
        <nav>
            <ul> <!--- The navigation buttons that can be clicked to navigate through the different pages --->

            </ul>
        </nav>
    </header>
    <main id="contactsMain">
        <fieldset><legend>Contact us</legend>  <!--- The form formatting tags --->
            <form action="">
                <label for="firstName">FirstName:</label>  <!--- A text box asking for and taking the input for the First Name --->
                <input type="text" name="firstName">
                <label for="secondName">LastName:</label><!--- A text box asking for and taking the input for the Last Name --->
                <input type="text" name="secondName">
                <br><br>
                <label for="email">Email</label><!--- A text box asking for and taking the input for the Email --->
                <input type="email" name="email" id="email">
                <br><br>
                <textarea name="" id="" cols="60" rows="20"></textarea> <!--- A text area box asking for and taking the input for a comment --->
                <br><br>
                <button id="submit">Submit</button> <!--- A Submit button allowing the user to submit the form --->
            </form>
        </fieldset>
    </main>
